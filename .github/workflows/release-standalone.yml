name: Build & Release Standalone

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-standalone
  cancel-in-progress: false

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Generate Prisma client
      - name: Generate Prisma client
        run: npx prisma generate

      # Build Next.js standalone (works cross-platform)
      - name: Build Next.js
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      # Pack standalone output
      - name: Pack standalone artifact
        run: |
          mkdir -p /tmp/erp-release
          cp -r .next/standalone/* /tmp/erp-release/
          cp -r .next/static /tmp/erp-release/.next/static
          cp -r public /tmp/erp-release/public 2>/dev/null || true
          cp -r prisma /tmp/erp-release/prisma
          cp -r node_modules/.prisma /tmp/erp-release/node_modules/.prisma 2>/dev/null || true
          cp -r node_modules/@prisma /tmp/erp-release/node_modules/@prisma 2>/dev/null || true
          cd /tmp/erp-release
          tar -czf /tmp/erp-standalone-arm64.tar.gz .
          echo "Artifact size: $(du -h /tmp/erp-standalone-arm64.tar.gz | cut -f1)"

      # Delete old "latest" release if exists, then create new one
      - name: Delete old latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete erp-latest --yes 2>/dev/null || true
          git push origin :refs/tags/erp-latest 2>/dev/null || true

      # Upload sebagai GitHub Release dengan tag tetap "erp-latest"
      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "erp-latest"
          name: "Razkindo ERP - Latest Build"
          body: |
            ## Razkindo ERP - Standalone Build
            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')

            ### Cara Update di STB:
            ```bash
            chmod +x deploy/deploy.sh
            ./deploy/deploy.sh --artifact
            ```
          files: /tmp/erp-standalone-arm64.tar.gz
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
